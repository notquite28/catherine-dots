[plugins]
enabled = [ "kenn/keybind-cheatsheet" ]

[shell]
settings_show_advanced = false
settings_window_translucent = true

[theme.templates]
builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "hyprland", "kitty", "qt" ]

[wallpaper.default]
path = "/home/quiet/Pictures/wallpapers/wallhaven-qrpdz7.jpg"

[wallpaper.last]
path = "/home/quiet/Pictures/wallpapers/wallhaven-qrpdz7.jpg"

[wallpaper.monitors.DP-1]
path = "/home/quiet/Pictures/wallpapers/wallhaven-qrpdz7.jpg"

[wallpaper.monitors.DP-2]
path = "/home/quiet/Pictures/wallpapers/wallhaven-qrpdz7.jpg"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.tray]
capsule = true